<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Personajes y modos de uso</title>
<style>
:root{color-scheme:dark;--gold:#e8c26a;--gold2:#a77c2c;--ink:#e9eeff;--mut:#9aa6cf;--row:#0d1634;--row2:#101c40;--line:#2a3a74;--c1:#4aa3ff;--c2:#b86bff;--c3:#ff4d5e;--c4:#5de07a;--c5:#f5a623;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--ink);font-family:"Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(circle at 20% 0,#2b2160 0,transparent 45%),radial-gradient(circle at 90% 10%,#40204f 0,transparent 40%),#070b1e;min-height:100%;-webkit-tap-highlight-color:transparent}
.frame{max-width:1000px;margin:10px auto;padding:3px;border-radius:14px;background:linear-gradient(135deg,var(--gold),var(--gold2) 40%,var(--gold) 70%,var(--gold2))}
.in{background:linear-gradient(#0a1030,#070c26);border-radius:12px;padding:16px 10px 14px;border:1px solid #000}
.hd{text-align:center;padding:4px 8px 12px}
.hd h1{margin:0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,5.5vw,32px);letter-spacing:1px;text-transform:uppercase;line-height:1.15;color:#fff;text-shadow:0 0 14px rgba(232,194,106,.55)}
.hd h1 span{color:var(--gold)}
.hd p{margin:6px 0 0;font-size:14px;color:var(--ink)}
.orn{height:2px;margin:10px auto 0;width:70%;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:6px;background:#0b1236;border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:10px}
.lg{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:9px;border:1px solid transparent;background:transparent;color:var(--ink);font-size:12px;text-align:left;font-family:inherit;line-height:1.15}
.lg .ic{font-size:20px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--c);background:#0a0f2a;flex:none}
.lg b{color:var(--c);font-weight:700}
.lg.on{border-color:var(--c);background:#131f4d}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input{flex:1;min-width:0;font-size:16px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#0b1236;color:var(--ink);font-family:inherit}
.tools button{flex:none;font-size:13px;padding:0 14px;border-radius:10px;border:1px solid var(--gold2);background:#17204a;color:var(--gold);font-family:inherit}
.cnt{font-size:12px;color:var(--mut);margin:0 2px 8px}
.th{display:none}
.list{display:block}
.r{display:grid;grid-template-columns:30px 44px 1fr;gap:8px;align-items:center;background:var(--row);border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-bottom:5px;break-inside:avoid}
.r:nth-child(even){background:var(--row2)}
.no{font-size:13px;color:var(--mut);text-align:center}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;border:2px solid var(--gold);box-shadow:0 0 8px rgba(232,194,106,.35)}
.nm{font-weight:700;font-size:14px;margin-bottom:2px}
.nm small{font-weight:400;font-size:11px;color:var(--gold);margin-left:6px}
.ln{font-size:11.5px;line-height:1.4;text-transform:uppercase;letter-spacing:.2px}
.ln b{text-transform:none;font-size:12px}
.ft{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;padding:12px 6px 4px;border-top:1px solid var(--gold2);font-size:12px;color:var(--mut)}
.ft i{font-family:Georgia,serif;color:var(--gold);font-size:14px}
.empty{padding:24px;text-align:center;color:var(--mut)}
.tabs2{display:flex;gap:6px;background:#0b1236;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}
.tabs2 button{flex:1;border:0;background:none;color:var(--mut);font-family:inherit;font-size:14px;font-weight:700;padding:10px 0;border-radius:9px}
.tabs2 button.on{background:linear-gradient(#2a3a74,#17204a);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold2)}
.sh{font-family:Georgia,serif;font-size:16px;color:var(--gold);margin:14px 0 8px;text-transform:uppercase;letter-spacing:1px;font-weight:400}
.spod{display:flex;gap:8px;align-items:flex-end;margin-bottom:6px}
.sp{flex:1;background:var(--row);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.sp.f{border:2px solid var(--gold);padding-top:16px;padding-bottom:16px}
.sp .av{margin:6px auto}.sp.f .av{width:54px;height:54px;font-size:18px}
.sp b{display:block;font-size:14px}.sp span{font-size:11px;color:var(--mut)}
.sr{display:flex;align-items:center;gap:8px;background:var(--row);border:1px solid var(--line);border-radius:8px;padding:7px 8px;margin-bottom:5px}
.sr .av{width:34px;height:34px;font-size:12px}.sr .mid{flex:1;min-width:0}
.sr .t{display:flex;justify-content:space-between;font-size:14px;font-weight:700;margin-bottom:4px}.sr .t i{font-style:normal;font-weight:400;font-size:12px;color:var(--mut)}
.sb{height:9px;background:#1b2757;border-radius:5px;overflow:hidden}.sb div{height:100%;border-radius:5px}
.schips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.sc{flex:none;border:1.5px solid var(--c);background:#0b1236;color:var(--ink);font-size:13px;padding:7px 13px;border-radius:999px;font-family:inherit}.sc.on{background:var(--c);color:#06102a;font-weight:700}
.smc{background:var(--row);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:8px;padding:10px;margin-bottom:6px}
.smc h3{margin:0 0 6px;font-size:14px;color:var(--c)}
.spl{border:1.5px solid var(--c);background:transparent;color:var(--ink);font-size:13px;padding:4px 10px;border-radius:999px;margin:0 4px 5px 0;font-family:inherit}.spl.sel{background:var(--c);color:#06102a;font-weight:700}
.sdet{display:none;background:var(--row2);border:2px solid var(--gold);border-radius:12px;padding:10px 12px;margin-bottom:10px}.sdet.show{display:block}
.sdet .hh{display:flex;align-items:center;gap:10px}.sdet .hh>div:nth-child(2){flex:1}.sdet .bg{font-size:20px;font-weight:700}
.sdet .x{border:0;background:#1b2757;color:var(--ink);width:32px;height:32px;border-radius:50%}
.sdet .li{font-size:13px;padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}.sdet .li span{font-size:11px;font-weight:700;color:#06102a;padding:2px 9px;border-radius:999px}
.sbtn{font-size:13px;padding:8px 14px;border-radius:10px;border:1px solid var(--gold2);background:#17204a;color:var(--gold);font-family:inherit}
.av.im{border-radius:10px;width:44px;height:44px;background-size:cover;background-position:center top;border:2px solid var(--gold);color:transparent;font-size:0}
.sr .av.im{width:38px;height:38px}.sp .av.im{width:52px;height:52px}.sp.f .av.im{width:68px;height:68px}
.r{cursor:pointer}.r:active{filter:brightness(1.3)}
.mo{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));background:rgba(3,6,20,.82)}
.mo.show{display:flex}
.mb{position:relative;width:100%;max-width:380px;max-height:100%;overflow-y:auto;background:linear-gradient(#0f1840,#080d29);border:2px solid var(--gold);border-radius:16px;padding:18px 16px 16px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.6)}
.mx{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold2);background:#17204a;color:var(--ink);font-size:16px;z-index:2}
.mi{width:min(62vw,230px);height:min(62vw,230px);margin:8px auto 10px;border-radius:14px;border:3px solid var(--gold);background-size:cover;background-position:center top;box-shadow:0 0 22px rgba(232,194,106,.4);display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:700;color:#fff}
.mn{font-family:Georgia,serif;font-size:25px;color:#fff;text-shadow:0 0 12px rgba(232,194,106,.5)}
.ms{font-size:13px;color:var(--mut);margin:2px 0 10px}
.mbar{height:8px;background:#1b2757;border-radius:5px;overflow:hidden;margin:0 auto 12px;max-width:260px}.mbar div{height:100%;background:linear-gradient(90deg,var(--gold),#ff4d5e)}
.mg{text-align:left;border-left:4px solid var(--c);background:var(--row);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.mg b{display:block;font-size:12px;color:var(--c);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.mg span{display:inline-block;font-size:13px;margin:0 5px 4px 0;padding:2px 10px;border:1px solid var(--c);border-radius:999px}
.fm{background:var(--row);border:1px solid var(--gold2);border-radius:10px;padding:8px 10px;margin:6px 0 4px}
.fh{font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}.fh b{font-size:16px;color:#fff}
.fr{display:flex;align-items:center;gap:10px;margin-bottom:8px}.fl{width:62px;font-size:11px;color:var(--mut);text-transform:uppercase;flex:none}
.ft2{border:0;background:none;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;padding:0}.ft2 i{font-style:normal;font-size:11px}
.fsc{display:flex;gap:10px;flex:1;min-width:0;overflow-x:auto;overflow-y:hidden;padding:4px 6px 8px;scrollbar-width:thin;scrollbar-color:var(--gold2) transparent;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.fsc::-webkit-scrollbar{height:5px}.fsc::-webkit-scrollbar-thumb{background:var(--gold2);border-radius:3px}
.fsc .ft2{flex:none;min-width:58px;white-space:nowrap}
.av.pn{font-size:18px}
@media (min-width:760px){
.in{padding:18px 16px 14px}
.th{display:grid;grid-template-columns:30px 44px 1fr;gap:8px;padding:8px;margin-bottom:6px;color:var(--gold);font-size:12px;letter-spacing:1.5px;text-transform:uppercase;border-bottom:1px solid var(--gold2)}

.list{column-count:2;column-gap:12px}
.nm{margin:0}
}
</style>
</head>
