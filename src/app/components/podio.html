@for (p of podio(); track p.c.nombre; let k = $index) {
  <button
    type="button"
    class="sp card"
    [class.f]="p.i === 0"
    [style.animation-delay.ms]="k * 90"
    [attr.aria-label]="'Puesto ' + (p.i + 1) + ': ' + p.c.nombre"
    (click)="juego.abierto.set(p.c.nombre)"
  >
    <span class="medal">{{ p.medalla }}</span>
    <app-avatar [nombre]="p.c.nombre" />
    <b class="text-truncate">{{ p.c.nombre }}</b>
    <span class="badge rounded-pill pp cuenta" [style.--n]="pct(p.c.total, total())"></span>
    <small>{{ p.c.total }} de {{ total() }}</small>
    <span class="pedestal"></span>
  </button>
}
