<div class="frame">
  <div class="in">
    <div class="bd">
      <div class="hd">
        <h1>Lista completa de <span>personajes que vale la pena evolucionar </span><br />y modos de uso</h1>
        <div class="orn"></div>
      </div>
      <div class="menu" [class.abierto]="submenu()">
        <nav class="tabs2 nav nav-pills nav-fill flex-nowrap" aria-label="Secciones">
          @for (s of secciones; track s.ruta) {
            <a
              class="nav-link"
              [routerLink]="s.ruta"
              routerLinkActive="active"
              ariaCurrentWhenActive="page"
              [routerLinkActiveOptions]="{ exact: s.ruta === '/' }"
              [attr.aria-expanded]="ruta() === s.ruta ? submenu() : null"
              aria-controls="submenu"
              (click)="pulsar(s.ruta)"
            ><span class="ni">{{ s.icono }}</span>{{ s.nombre }}<span class="car">▾</span></a>
          }
        </nav>
        @if (submenu()) {
          <app-filtros id="submenu" [ruta]="ruta()" />
        }
      </div>
      <router-outlet />
    </div>
    <div class="ft"><span></span><i>Más héroes, más posibilidades.</i></div>
  </div>
</div>
<app-personaje-modal />
