<div class="cnt d-flex align-items-center gap-2">
  <span class="text-nowrap">{{ filtrados().length }} de {{ total }} personajes</span>
  <div class="progress flex-grow-1" role="progressbar" [attr.aria-valuenow]="filtrados().length" aria-valuemin="0" [attr.aria-valuemax]="total">
    <div class="progress-bar progress-bar-striped progress-bar-animated" [style.width.%]="(filtrados().length / total) * 100"></div>
  </div>
</div>
<div class="list row row-cols-1 row-cols-md-2 row-cols-xl-3 g-2">
  @for (p of filtrados(); track p.nombre; let i = $index) {
    <div class="col" [style.animation-delay.ms]="i < 20 ? i * 30 : 0">
      <div class="r card h-100" [style.--c]="rol(p.nombre) ? rolColor[rol(p.nombre)!] : null" (click)="seleccion.abrir(p.nombre)">
        <div class="card-body d-flex align-items-center gap-2">
          <span class="no badge rounded-pill">{{ i + 1 }}</span>
          <app-avatar [nombre]="p.nombre" />
          <div class="tx flex-grow-1 min-w-0">
            <div class="nm text-truncate">{{ p.nombre }}</div>
            @if (rol(p.nombre); as r) {
              <span class="rl badge rounded-pill" [style.color]="rolColor[r]" [style.border-color]="rolColor[r]">
                @if (rolIcono[r].endsWith('.svg')) {<img class="ri" [src]="rolIcono[r]" alt="" />} @else {<span class="ri">{{ rolIcono[r] }}</span>}
                {{ r }}
              </span>
            }
          </div>
          <span class="go">›</span>
        </div>
      </div>
    </div>
  } @empty {
    <div class="col-12">
      <div class="empty alert alert-dark text-center mb-0">😕 Sin resultados</div>
    </div>
  }
</div>
